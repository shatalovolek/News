# Render Blueprint for news.beat-trade.com — one long-running Python web service
# (same pattern as the poker backend, but here it also serves the page itself).
services:
  - type: web
    name: stock-newsroom
    runtime: python
    plan: starter                 # paid instance: no sleeping, and a persistent disk is allowed
    region: frankfurt
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python server.py --host 0.0.0.0"
    healthCheckPath: /api/health
    disk:                         # survives deploys and restarts: histories, prices, pictures, companies.json
      name: newsroom-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.4"
      - key: REFRESH_HOURS
        value: "2"
      - key: TZ                   # timestamps on the pictures and the page in the user's time zone
        value: Europe/Vienna
      - key: DATA_DIR             # everything the agent writes lives on the disk
        value: /data
      # Optional, set in the dashboard, never here:
      #   ANTHROPIC_API_KEY     enables the AI briefs; BRIEF_LANG=ru for Russian, BRIEF_MODEL to change the model
      #   GITHUB_TOKEN          also commits companies.json to the repo
      #   REDDIT_CLIENT_ID / REDDIT_CLIENT_SECRET   enable Reddit in the Social section
      #   TAVILY_API_KEY        adds Tavily news search to the feeds, and Tavily /extract as a
      #                         fallback when our own scrape can't read an article page
